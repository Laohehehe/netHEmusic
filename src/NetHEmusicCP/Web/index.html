<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>netHEmusic</title>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/effects.css">
</head>
<body>
<script>
/* 脚本错误可视化：任何未捕获的 JS 错误都会直接在界面上显示，避免只看到「加载中…」却不知原因。
   这里是纯内联实现（不依赖任何外部 CSS/JS），保证即使其它脚本挂了也能显示。 */
(function () {
  window.__NE_ERR = [];
  function box() {
    var b = document.getElementById('js-error-box');
    if (b) return b;
    b = document.createElement('div');
    b.id = 'js-error-box';
    b.setAttribute('style', 'position:fixed;left:10px;bottom:10px;z-index:2147483647;max-width:70vw;max-height:45vh;overflow:auto;' +
      'background:#5c1111;color:#ffe3e3;border:1px solid #ff6b6b;border-radius:8px;padding:8px 30px 8px 10px;' +
      'font:12px/1.5 Consolas,monospace;white-space:pre-wrap;word-break:break-all;box-shadow:0 6px 24px rgba(0,0,0,.5)');
    var x = document.createElement('span');
    x.textContent = '×';
    x.setAttribute('style', 'position:absolute;right:6px;top:2px;cursor:pointer;font-size:16px;color:#ffb3b3');
    x.onclick = function () { window.__NE_ERR = []; b.remove(); };
    b.appendChild(x);
    (document.body || document.documentElement).appendChild(b);
    return b;
  }
  function show(kind, msg, where, stack) {
    var rec = { kind: kind, msg: String(msg), where: String(where || ''), stack: String(stack || '') };
    window.__NE_ERR.push(rec);
    try { console.error('[NE-JS-ERROR]', kind, rec.msg, rec.where, rec.stack); } catch (e) { }
    try {
      if (window.chrome && chrome.webview && chrome.webview.postMessage) {
        chrome.webview.postMessage(JSON.stringify({ type: 'log', msg: 'JS错误: ' + kind + ' ' + rec.msg + ' @' + rec.where + '\n' + rec.stack.split('\n').slice(0, 4).join('\n') }));
      }
    } catch (e) { }
    var b = box();
    var p = document.createElement('div');
    p.textContent = '[' + kind + '] ' + rec.msg + (rec.where ? '\n  @ ' + rec.where : '') +
      (rec.stack ? '\n' + rec.stack.split('\n').slice(0, 4).join('\n') : '');
    p.setAttribute('style', 'margin:0 0 6px;border-bottom:1px dashed rgba(255,255,255,.25);padding-bottom:4px');
    b.appendChild(p);
  }
  window.NE_showErr = show;
  window.addEventListener('error', function (e) {
    var t = e.target;
    if (t && t !== window && t.tagName && (t.src || t.href)) {
      var url = t.src || t.href;
      window.__NE_ERR.push({ kind: '资源加载失败', msg: t.tagName + ' ' + url, where: '', stack: '' });
      try { console.warn('[NE-RES-ERROR]', t.tagName, url); } catch (x) { }
      if (t.tagName === 'SCRIPT' || t.tagName === 'LINK') show('资源加载失败', t.tagName + ' ' + url, '', '');
      return;
    }
    show('运行时错误', e.message, (e.filename || '?') + ':' + e.lineno + ':' + e.colno, (e.error && e.error.stack) || '');
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    show('Promise 未处理', (r && (r.message || r)) || 'unknown', '', (r && r.stack) || '');
  });
})();
</script>
<div id="app">
  <!-- 侧栏：默认收起(仅图标)，鼠标悬停展开 -->
  <aside id="sidebar">
    <div class="brand"><span class="brand-dot"></span><span class="label">netHEmusic</span></div>
    <nav id="nav">
      <a data-nav="home" class="on" title="主页"><i class="ic">&#xE80F;</i><span class="label">主页</span></a>
      <a data-nav="liked" title="我的歌单"><i class="ic">&#xE8FD;</i><span class="label">我的歌单</span></a>
      <a data-nav="account" title="账号"><i class="ic">&#xE77B;</i><span class="label">账号</span></a>
      <a data-nav="downloads" title="下载管理"><i class="nav-svg"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg></i><span class="label">下载管理</span></a>
      <a data-nav="plugins" title="插件"><i class="nav-svg"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg></i><span class="label">插件</span></a>
    </nav>
    <a data-nav="settings" class="nav-bottom" title="设置"><i class="ic">&#xE713;</i><span class="label">设置</span></a>
  </aside>

  <div id="main">
    <header id="topbar">
      <div class="tb-search">
        <i class="ic">&#xE721;</i>
        <input id="topbar-search" type="text" placeholder="搜索音乐、歌手、专辑" autocomplete="off">
      </div>
      <!-- 设置页专属 headtop：进设置页时整条顶栏换成这排分组按钮（由 app.js 填充），离开展示搜索框 -->
      <div class="set-nav" id="set-nav" aria-hidden="true"></div>
    </header>
    <main id="view"><div class="big-load">加载中…</div></main>

    <!-- 全窗口歌词页（点 dock 封面进入，Esc / 右下角按钮收起） -->
    <div id="np" class="np" aria-hidden="true">
      <div class="np-bg" id="np-bg"></div>
      <div class="np-scrim"></div>
      <canvas class="np-bg-fx" id="np-bgfx"></canvas>
      <div class="np-wrap">
        <div class="np-left">
          <div class="np-cover-wrap">
            <i class="ic np-cover-ph">&#xE8D6;</i>
            <img class="np-cover" id="np-cover" alt="">
          </div>
          <div class="np-title" id="np-title">未在播放</div>
          <div class="np-artist" id="np-artist">—</div>
          <div class="np-album" id="np-album"></div>
        </div>
        <div class="np-right">
          <div class="np-lyric" id="np-lyric"><div class="np-lyric-inner" id="np-lyric-inner"></div></div>
        </div>
      </div>
      <div class="np-bar">
        <div class="np-bar-row np-bar-ctrl">
          <button class="np-btn" id="np-prev" title="上一首"></button>
          <button class="np-btn np-play" id="np-play" title="播放/暂停"></button>
          <button class="np-btn" id="np-next" title="下一首"></button>
          <span class="np-sep"></span>
          <button class="np-btn" id="np-download" title="下载">
        <button id="np-qual" title="音质" class="ic-btn"></button></button>
          <button class="np-btn" id="np-share" title="分享"></button>
          <button class="np-close" id="np-close" title="收起歌词页 (Esc)"></button>
        </div>
        <div class="np-bar-row">
          <span class="np-time" id="np-cur">00:00</span>
          <div class="np-prog" id="np-prog"><div class="np-buf" id="np-buf"></div><div class="np-fill" id="np-fill"></div><div class="np-tip" id="np-tip"></div></div>
          <span class="np-time" id="np-dur">00:00</span>
        </div>
      </div>
      <!-- 歌词显示设置（在歌词页里可视化调整） -->
      <button class="np-gear" id="np-gear" title="歌词显示设置"></button>
      <aside class="np-settings" id="np-settings" aria-hidden="true">
        <div class="np-settings-head">
          <span>歌词显示设置</span>
          <span class="np-settings-hint">再点右上角齿轮即可收起</span>
        </div>
        <div class="np-settings-body" id="np-settings-body"></div>
      </aside>
    </div>

    <!-- 播放列表右键菜单 -->
    <div id="pl-ctx" class="ctx-menu pl-ctx" style="display:none"></div>

    <!-- 歌单卡片右键菜单（分享 / 添加至播放列表 / 删除歌单） -->
    <div id="plcard-ctx" class="ctx-menu pl-ctx" style="display:none"></div>

    <!-- 当前播放列表面板（点 dock 最右侧 list 按钮弹出） -->
    <div id="plpanel" class="pl-panel">
      <div class="pl-panel-head">
        <span class="pl-panel-title">当前播放列表</span>
        <span class="pl-panel-count" id="plpanel-count"></span>
        <button class="pl-clear" id="plpanel-clear" title="清空播放列表"></button>
      </div>
      <div class="pl-panel-list" id="plpanel-list"></div>
    </div>

    <!-- 悬浮 dock：位于 #main 内部，随内容区宽度自适应 -->
    <footer id="player">
      <div class="pl-left">
        <div class="pl-cover-wrap" id="pl-cover-wrap">
          <i class="ic pl-cover-ph">&#xE8D6;</i>
          <img id="pl-cover" class="pl-cover" title="点击查看歌词">
        </div>
        <div class="pl-meta"><div id="pl-title">未在播放</div><div id="pl-artist">—</div></div>
      </div>
      <div class="pl-center">
        <div class="pl-btns">
          <button id="pb-mode" title="切换播放模式" class="ic-btn"></button>
          <button id="pb-prev" title="上一首" class="ic-btn"></button>
          <button id="pb-play" title="播放/暂停" class="ic-btn big"></button>
          <button id="pb-next" title="下一首" class="ic-btn"></button>
          <button id="pb-lyric" title="桌面歌词" class="ic-btn ly-btn"><span class="ly-txt">词</span><span class="ly-badge"></span></button>
        </div>
        <div class="pl-prog">
          <span id="pl-cur">00:00</span>
          <div id="pl-bar" class="pl-bar"><div id="pl-buf"></div><div id="pl-fill"></div></div>
          <span id="pl-dur">00:00</span>
        </div>
      </div>
      <div class="pl-right">
        <span class="pl-vol" id="pl-vol-icon" title="音量"><i class="ic">&#xE767;</i></span>
        <input id="pl-volume" type="range" min="0" max="100" value="80">
        <button id="pl-like" title="喜欢" class="ic-btn"></button>
        <button id="pl-dl" title="下载" class="ic-btn"></button>
      <button id="pl-qual" title="音质" class="ic-btn"></button>
        <button id="pl-list" title="当前播放列表" class="ic-btn"></button>
      </div>
    </footer>
  </div>
</div>
<!-- ===== 更新公告弹窗（内容由 C# 从 Release 拉取后渲染） ===== -->
<div id="notice" class="modal-mask" aria-hidden="true">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="notice-title">
    <div class="modal-head">
      <span class="modal-dot"></span>
      <h3 id="notice-title">公告</h3>
    </div>
    <div class="modal-body">
      <p id="notice-lead"></p>
      <!-- 更新公告正文：运行时从 GitHub Release 取，按 Markdown 渲染，不在程序里写死 -->
      <div id="notice-body" class="notice-md"></div>
      <p class="modal-tip" id="notice-ver"></p>
    </div>
    <div class="modal-foot">
      <button class="action-btn" data-close>知道了</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" style="display:none"></div>
<script src="js/api.js"></script>
<script src="js/plugins.js"></script>
<script src="js/app.js"></script>
<script src="js/fx.js"></script>
<script src="js/glass.js"></script>
<!-- 音质切换浮层（挂在 body 上，避免被任何 overflow 裁掉） -->
<div id="qual-menu" class="qual-menu" role="menu"></div>
</body>
</html>
