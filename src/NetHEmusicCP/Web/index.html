<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>netHEmusic</title>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/effects.css">
</head>
<body>
<div id="app">
  <!-- 侧栏：默认收起(仅图标)，鼠标悬停展开 -->
  <aside id="sidebar">
    <div class="brand"><span class="brand-dot"></span><span class="label">netHEmusic</span></div>
    <nav id="nav">
      <a data-nav="home" class="on" title="主页"><i class="ic">&#xE80F;</i><span class="label">主页</span></a>
      <a data-nav="liked" title="我的歌单"><i class="ic">&#xE8FD;</i><span class="label">我的歌单</span></a>
      <a data-nav="account" title="账号"><i class="ic">&#xE77B;</i><span class="label">账号</span></a>
    </nav>
    <a data-nav="settings" class="nav-bottom" title="设置"><i class="ic">&#xE713;</i><span class="label">设置</span></a>
  </aside>

  <div id="main">
    <header id="topbar">
      <div class="tb-search">
        <i class="ic">&#xE721;</i>
        <input id="topbar-search" type="text" placeholder="搜索音乐、歌手、专辑" autocomplete="off">
      </div>
    </header>
    <main id="view"><div class="big-load">加载中…</div></main>

    <!-- 全窗口歌词页（点 dock 封面进入，Esc / 右下角按钮收起） -->
    <div id="np" class="np" aria-hidden="true">
      <div class="np-bg" id="np-bg"></div>
      <div class="np-scrim"></div>
      <canvas class="np-bg-fx" id="np-bgfx"></canvas>
      <div class="np-wrap">
        <div class="np-left">
          <div class="np-cover-wrap">
            <i class="ic np-cover-ph">&#xE8D6;</i>
            <img class="np-cover" id="np-cover" src="" alt="">
          </div>
          <div class="np-title" id="np-title">未在播放</div>
          <div class="np-artist" id="np-artist">—</div>
          <div class="np-album" id="np-album"></div>
        </div>
        <div class="np-right">
          <div class="np-lyric" id="np-lyric"><div class="np-lyric-inner" id="np-lyric-inner"></div></div>
        </div>
      </div>
      <div class="np-bar">
        <div class="np-bar-row">
          <span class="np-time" id="np-cur">00:00</span>
          <div class="np-prog" id="np-prog"><div class="np-fill" id="np-fill"></div></div>
          <span class="np-time" id="np-dur">00:00</span>
        </div>
        <div class="np-bar-row np-bar-ctrl">
          <button class="np-btn" id="np-prev" title="上一首"></button>
          <button class="np-btn np-play" id="np-play" title="播放/暂停"></button>
          <button class="np-btn" id="np-next" title="下一首"></button>
          <span class="np-sep"></span>
          <button class="np-btn" id="np-download" title="下载"></button>
          <button class="np-btn" id="np-share" title="分享"></button>
          <button class="np-close" id="np-close" title="收起歌词页 (Esc)"></button>
        </div>
      </div>
      <!-- 歌词显示设置（在歌词页里可视化调整） -->
      <button class="np-gear" id="np-gear" title="歌词显示设置"></button>
      <aside class="np-settings" id="np-settings" aria-hidden="true">
        <div class="np-settings-head">
          <span>歌词显示设置</span>
          <span class="np-settings-hint">再点右上角齿轮即可收起</span>
        </div>
        <div class="np-settings-body" id="np-settings-body"></div>
      </aside>
    </div>

    <!-- 播放列表右键菜单 -->
    <div id="pl-ctx" class="ctx-menu pl-ctx" style="display:none"></div>

    <!-- 当前播放列表面板（点 dock 最右侧 list 按钮弹出） -->
    <div id="plpanel" class="pl-panel">
      <div class="pl-panel-head">
        <span class="pl-panel-title">当前播放列表</span>
        <span class="pl-panel-count" id="plpanel-count"></span>
        <button class="pl-clear" id="plpanel-clear" title="清空播放列表"></button>
      </div>
      <div class="pl-panel-list" id="plpanel-list"></div>
    </div>

    <!-- 悬浮 dock：位于 #main 内部，随内容区宽度自适应 -->
    <footer id="player">
      <div class="pl-left">
        <div class="pl-cover-wrap" id="pl-cover-wrap">
          <i class="ic pl-cover-ph">&#xE8D6;</i>
          <img id="pl-cover" class="pl-cover" src="" title="点击查看歌词">
        </div>
        <div class="pl-meta"><div id="pl-title">未在播放</div><div id="pl-artist">—</div></div>
      </div>
      <div class="pl-center">
        <div class="pl-btns">
          <button id="pb-mode" title="切换播放模式" class="ic-btn"></button>
          <button id="pb-prev" title="上一首" class="ic-btn"></button>
          <button id="pb-play" title="播放/暂停" class="ic-btn big"></button>
          <button id="pb-next" title="下一首" class="ic-btn"></button>
          <button id="pb-lyric" title="桌面歌词" class="ic-btn ly-btn"><span class="ly-txt">词</span><span class="ly-badge"></span></button>
        </div>
        <div class="pl-prog">
          <span id="pl-cur">00:00</span>
          <div id="pl-bar" class="pl-bar"><div id="pl-fill"></div></div>
          <span id="pl-dur">00:00</span>
        </div>
      </div>
      <div class="pl-right">
        <span class="pl-vol" id="pl-vol-icon" title="音量"><i class="ic">&#xE767;</i></span>
        <input id="pl-volume" type="range" min="0" max="100" value="80">
        <button id="pl-like" title="收藏" class="ic-btn"></button>
        <button id="pl-dl" title="下载" class="ic-btn"></button>
        <button id="pl-list" title="当前播放列表" class="ic-btn"></button>
      </div>
    </footer>
  </div>
</div>
<!-- ===== 公告弹窗（测试用，内容随便改） ===== -->
<div id="notice" class="modal-mask" aria-hidden="true">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="notice-title">
    <div class="modal-head">
      <span class="modal-dot"></span>
      <h3 id="notice-title">公告</h3>
    </div>
    <div class="modal-body">
      <p id="notice-lead"></p>
      <!-- 更新公告正文：运行时从 GitHub Release 取，按 Markdown 渲染，不在程序里写死 -->
      <div id="notice-body" class="notice-md"></div>
      <p class="modal-tip" id="notice-ver"></p>
    </div>
    <div class="modal-foot">
      <button class="action-btn" data-close>知道了</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" style="display:none"></div>
<script src="js/bridge.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/fx.js"></script>
</body>
</html>
