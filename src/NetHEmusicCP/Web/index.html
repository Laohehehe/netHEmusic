<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>netHEmusic</title>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/effects.css">
</head>
<body>
<div id="app">
  <!-- 侧栏：默认收起(仅图标)，鼠标悬停展开 -->
  <aside id="sidebar">
    <div class="brand"><span class="brand-dot"></span><span class="label">netHEmusic</span></div>
    <nav id="nav">
      <a data-nav="home" class="on" title="主页"><i class="ic">&#xE80F;</i><span class="label">主页</span></a>
      <a data-nav="liked" title="我喜欢的音乐"><i class="ic">&#xE734;</i><span class="label">我喜欢的音乐</span></a>
      <a data-nav="account" title="账号"><i class="ic">&#xE77B;</i><span class="label">账号</span></a>
    </nav>
    <a data-nav="settings" class="nav-bottom" title="设置"><i class="ic">&#xE713;</i><span class="label">设置</span></a>
  </aside>

  <div id="main">
    <header id="topbar">
      <div class="tb-search">
        <i class="ic">&#xE721;</i>
        <input id="topbar-search" type="text" placeholder="搜索音乐、歌手、专辑" autocomplete="off">
      </div>
    </header>
    <main id="view"><div class="big-load">加载中…</div></main>

    <!-- 悬浮 dock：位于 #main 内部，随内容区宽度自适应 -->
    <footer id="player">
      <div class="pl-left">
        <div class="pl-cover-wrap" id="pl-cover-wrap">
          <i class="ic pl-cover-ph">&#xE8D6;</i>
          <img id="pl-cover" class="pl-cover" src="" title="点击查看歌词">
        </div>
        <div class="pl-meta"><div id="pl-title">未在播放</div><div id="pl-artist">—</div></div>
      </div>
      <div class="pl-center">
        <div class="pl-btns">
          <button id="pb-shuffle" title="随机" class="ic-btn"><i class="ic">&#xE8B0;</i></button>
          <button id="pb-prev" title="上一首" class="ic-btn"><i class="ic">&#xE892;</i></button>
          <button id="pb-play" title="播放/暂停" class="ic-btn big"><i class="ic">&#xE768;</i></button>
          <button id="pb-next" title="下一首" class="ic-btn"><i class="ic">&#xE893;</i></button>
          <button id="pb-mode" title="循环" class="ic-btn"><i class="ic">&#xE8EE;</i></button>
        </div>
        <div class="pl-prog">
          <span id="pl-cur">00:00</span>
          <div id="pl-bar" class="pl-bar"><div id="pl-fill"></div></div>
          <span id="pl-dur">00:00</span>
        </div>
      </div>
      <div class="pl-right">
        <span class="pl-vol"><i class="ic">&#xE767;</i></span>
        <input id="pl-volume" type="range" min="0" max="100" value="80">
        <button id="pl-like" title="收藏" class="ic-btn"><i class="ic">&#xE734;</i></button>
        <button id="pl-dl" title="下载" class="ic-btn"><i class="ic">&#xE896;</i></button>
      </div>
    </footer>
  </div>
</div>
<!-- ===== 公告弹窗（测试用，内容随便改） ===== -->
<div id="notice" class="modal-mask" aria-hidden="true">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="notice-title">
    <div class="modal-head">
      <span class="modal-dot"></span>
      <h3 id="notice-title">公告</h3>
    </div>
    <div class="modal-body">
      <p id="notice-lead"></p>
      <!-- ======== 更新公告正文（占位内容，已注释；下次发版时把下面这段取消注释并改写） ========
      <p>· 新增：xxx 功能，可在 设置 → xxx 里调整<br>
         · 优化：xxx 的交互与动画<br>
         · 修复：xxx 问题</p>
      ======== 更新公告正文结束 ======== -->
      <p class="modal-tip" id="notice-ver"></p>
    </div>
    <div class="modal-foot">
      <button class="action-btn" data-close>知道了</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" style="display:none"></div>
<script src="js/bridge.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/fx.js"></script>
</body>
</html>
